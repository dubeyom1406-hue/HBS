openapi: 3.1.0
info:
  title: Bihar Healthcare Grievance System API
  version: 1.0.0
  description: >
    Backend contract for the current multi-page frontend. The API owns
    persistence, validation, IDs, authorization, and audit timestamps.
    This file describes endpoints for the backend developer to implement;
    it is not a running API server. The frontend currently loads and saves
    its complete workspace with GET and PUT /backup. Authentication may use
    a backend-managed HttpOnly session cookie or an Authorization bearer token.
servers:
  - url: /api/v1
    description: Same-origin API; use a reverse proxy if frontend and API are deployed separately.
security:
  - bearerAuth: []
  - cookieAuth: []
tags:
  - name: Authentication
  - name: Hospital
  - name: Dashboard
  - name: Departments
  - name: Staff
  - name: Complaints
  - name: Notifications
  - name: Audit
  - name: Backup
paths:
  /health:
    get:
      tags: [Authentication]
      summary: Check API availability
      security: []
      responses:
        "200":
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    const: ok
                  timestamp:
                    type: string
                    format: date-time
  /auth/login:
    post:
      tags: [Authentication]
      summary: Sign in to a staff account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        "200":
          description: >
            Signed in. Cookie-based implementations should set the
            bhgs_session cookie with Secure, HttpOnly and SameSite protections.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  accessToken:
                    type: string
                  tokenType:
                    const: Bearer
                  expiresIn:
                    type: integer
                    description: Access-token lifetime in seconds.
                  user:
                    $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      tags: [Authentication]
      summary: Get the signed-in user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      tags: [Authentication]
      summary: Revoke the current session or refresh token
      responses:
        "204":
          description: Signed out
        "401":
          $ref: "#/components/responses/Unauthorized"
  /hospital:
    get:
      tags: [Hospital]
      summary: Get the current hospital profile
      responses:
        "200":
          description: Hospital profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hospital"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Hospital]
      summary: Update hospital profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HospitalUpdate"
      responses:
        "200":
          description: Updated hospital profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Hospital"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /settings:
    get:
      tags: [Hospital]
      summary: Get workspace preferences
      responses:
        "200":
          description: Preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Hospital]
      summary: Update workspace preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsUpdate"
      responses:
        "200":
          description: Updated preferences
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: Get dashboard counters and seven-day complaint activity
      responses:
        "200":
          description: Dashboard data derived from persisted records
          content:
            application/json:
              schema:
                type: object
                required: [departments, staff, complaints, activity]
                properties:
                  departments:
                    type: object
                    required: [total]
                    properties:
                      total:
                        type: integer
                  staff:
                    type: object
                    required: [total, active]
                    properties:
                      total:
                        type: integer
                      active:
                        type: integer
                  complaints:
                    type: object
                    required: [total, open, critical]
                    properties:
                      total:
                        type: integer
                      open:
                        type: integer
                      critical:
                        type: integer
                  activity:
                    type: array
                    items:
                      type: object
                      required: [date, received, resolved]
                      properties:
                        date:
                          type: string
                          format: date
                        received:
                          type: integer
                        resolved:
                          type: integer
        "401":
          $ref: "#/components/responses/Unauthorized"
  /departments:
    get:
      tags: [Departments]
      summary: List departments
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Department list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DepartmentList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Departments]
      summary: Create a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentInput"
      responses:
        "201":
          description: Created department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /departments/{departmentId}:
    parameters:
      - name: departmentId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Departments]
      summary: Get a department
      responses:
        "200":
          description: Department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Departments]
      summary: Update a department
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DepartmentUpdate"
      responses:
        "200":
          description: Updated department
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Departments]
      summary: Delete an unreferenced department
      description: Return 409 while staff or complaints still reference this department.
      responses:
        "204":
          description: Department deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /staff:
    get:
      tags: [Staff]
      summary: List staff profiles
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: departmentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Inactive]
      responses:
        "200":
          description: Staff list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StaffList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Staff]
      summary: Create a staff profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffInput"
      responses:
        "201":
          description: Created staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /staff/{staffId}:
    parameters:
      - name: staffId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Staff]
      summary: Get a staff profile
      responses:
        "200":
          description: Staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Staff]
      summary: Update a staff profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StaffUpdate"
      responses:
        "200":
          description: Updated staff profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Staff"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Staff]
      summary: Delete a staff profile
      description: Reassign cases owned by this staff member before deletion.
      responses:
        "204":
          description: Staff profile deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /complaints:
    get:
      tags: [Complaints]
      summary: List and filter complaints
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: departmentId
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            type: string
            enum: [Open, In progress, Resolved]
        - name: priority
          in: query
          schema:
            type: string
            enum: [Low, Medium, High, Critical]
        - name: assignedStaffId
          in: query
          schema:
            type: string
        - name: criticalOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Complaint list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ComplaintList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [Complaints]
      summary: Create a complaint
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintInput"
      responses:
        "201":
          description: Created complaint, including server-generated ID and timestamps
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /complaints/{complaintId}:
    parameters:
      - name: complaintId
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Complaints]
      summary: Get a complaint and its recorded details
      responses:
        "200":
          description: Complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Complaints]
      summary: Update complaint details or workflow status
      description: The server records resolvedAt when status first changes to Resolved.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ComplaintUpdate"
      responses:
        "200":
          description: Updated complaint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Complaint"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
    delete:
      tags: [Complaints]
      summary: Delete a complaint
      responses:
        "204":
          description: Complaint deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the current user
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
        - name: unreadOnly
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationList"
        "401":
          $ref: "#/components/responses/Unauthorized"
    delete:
      tags: [Notifications]
      summary: Clear read notifications
      parameters:
        - name: readOnly
          in: query
          required: true
          schema:
            const: true
      responses:
        "204":
          description: Read notifications cleared
        "401":
          $ref: "#/components/responses/Unauthorized"
  /notifications/{notificationId}:
    parameters:
      - name: notificationId
        in: path
        required: true
        schema:
          type: string
    patch:
      tags: [Notifications]
      summary: Mark a notification as read
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [read]
              properties:
                read:
                  const: true
      responses:
        "200":
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications/read-all:
    post:
      tags: [Notifications]
      summary: Mark all notifications as read for the current user
      responses:
        "204":
          description: All notifications marked as read
        "401":
          $ref: "#/components/responses/Unauthorized"
  /audit:
    get:
      tags: [Audit]
      summary: List audit events
      parameters:
        - $ref: "#/components/parameters/Search"
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditList"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /backup:
    get:
      tags: [Backup]
      summary: Export the current hospital workspace backup
      responses:
        "200":
          description: Workspace backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBackup"
        "401":
          $ref: "#/components/responses/Unauthorized"
    put:
      tags: [Backup]
      summary: Validate and replace workspace data from a backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceBackup"
      responses:
        "200":
          description: Restored workspace backup
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceBackup"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    cookieAuth:
      type: apiKey
      in: cookie
      name: bhgs_session
      description: >
        Prefer Secure, HttpOnly, SameSite cookies. Protect cookie-authenticated
        write requests against CSRF and validate the frontend origin.
  parameters:
    Search:
      name: q
      in: query
      schema:
        type: string
        maxLength: 100
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  responses:
    BadRequest:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Unauthorized:
      description: Missing, expired or invalid credentials
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Requested resource does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    Conflict:
      description: Duplicate, stale or referenced resource conflict
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    ErrorResponse:
      type: object
      required: [error, requestId]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  field:
                    type: string
                  message:
                    type: string
        requestId:
          type: string
    User:
      type: object
      required: [id, name, email, role, hospitalId]
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [hospital_admin, department_head, staff]
        hospitalId:
          type: string
    Hospital:
      type: object
      required: [id, name, district, state, email, phone, slaHours]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 120
        district:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 120
            - type: string
              maxLength: 0
        phone:
          type: string
          maxLength: 30
        slaHours:
          type: integer
          minimum: 1
          maximum: 720
    HospitalUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 120
        district:
          type: string
          maxLength: 80
        state:
          type: string
          maxLength: 80
        email:
          anyOf:
            - type: string
              format: email
              maxLength: 120
            - type: string
              maxLength: 0
        phone:
          type: string
          maxLength: 30
        slaHours:
          type: integer
          minimum: 1
          maximum: 720
    Settings:
      type: object
      required: [notifications, criticalAlerts, compactTables, slaHours]
      properties:
        notifications:
          type: boolean
        criticalAlerts:
          type: boolean
        compactTables:
          type: boolean
        slaHours:
          type: integer
          minimum: 1
          maximum: 720
    SettingsUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        notifications:
          type: boolean
        criticalAlerts:
          type: boolean
        compactTables:
          type: boolean
        slaHours:
          type: integer
          minimum: 1
          maximum: 720
    Department:
      type: object
      required: [id, name, head, beds, staff, status, color, icon, description]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        head:
          type: string
          maxLength: 80
        beds:
          type: integer
          minimum: 0
          maximum: 5000
        staff:
          type: integer
          minimum: 0
          maximum: 5000
        status:
          type: string
          enum: [Active, Inactive]
        color:
          type: string
          enum: [purple, teal, orange, red]
        icon:
          type: string
          maxLength: 4
        description:
          type: string
          maxLength: 300
    DepartmentInput:
      type: object
      required: [name, head, beds, staff, status, color, icon, description]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        head:
          type: string
          maxLength: 80
        beds:
          type: integer
          minimum: 0
          maximum: 5000
        staff:
          type: integer
          minimum: 0
          maximum: 5000
        status:
          type: string
          enum: [Active, Inactive]
        color:
          type: string
          enum: [purple, teal, orange, red]
        icon:
          type: string
          maxLength: 4
        description:
          type: string
          maxLength: 300
    DepartmentUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        head:
          type: string
          maxLength: 80
        beds:
          type: integer
          minimum: 0
          maximum: 5000
        staff:
          type: integer
          minimum: 0
          maximum: 5000
        status:
          type: string
          enum: [Active, Inactive]
        color:
          type: string
          enum: [purple, teal, orange, red]
        icon:
          type: string
          maxLength: 4
        description:
          type: string
          maxLength: 300
    Staff:
      type: object
      required: [id, name, role, department, email, phone, shift, status]
      properties:
        id:
          type: string
        name:
          type: string
          maxLength: 80
        role:
          type: string
          maxLength: 80
        department:
          type: string
        email:
          type: string
          format: email
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        shift:
          type: string
          enum: [Morning, Evening, Night]
        status:
          type: string
          enum: [Active, Inactive]
    StaffInput:
      type: object
      required: [name, role, department, email, phone, shift, status]
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        role:
          type: string
          maxLength: 80
        department:
          type: string
        email:
          type: string
          format: email
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        shift:
          type: string
          enum: [Morning, Evening, Night]
        status:
          type: string
          enum: [Active, Inactive]
    StaffUpdate:
      type: object
      minProperties: 1
      additionalProperties: false
      properties:
        name:
          type: string
          maxLength: 80
        role:
          type: string
          maxLength: 80
        department:
          type: string
        email:
          type: string
          format: email
          maxLength: 120
        phone:
          type: string
          maxLength: 30
        shift:
          type: string
          enum: [Morning, Evening, Night]
        status:
          type: string
          enum: [Active, Inactive]
    Complaint:
      type: object
      required: [id, patient, subject, department, priority, status, assigned, created, resolvedAt, description]
      properties:
        id:
          type: string
        patient:
          type: string
          maxLength: 80
        subject:
          type: string
          maxLength: 120
        department:
          type: string
        priority:
          type: string
          enum: [Low, Medium, High, Critical]
        status:
          type: string
          enum: [Open, In progress, Resolved]
        assigned:
          type: string
          maxLength: 80
          description: Use Unassigned when no staff member owns the complaint.
        created:
          type: string
          format: date-time
        resolvedAt:
          anyOf:
            - type: string
              format: date-time
            - type: string
              maxLength: 0
          description: Empty string when the complaint has not been resolved.
        description:
          type: string
